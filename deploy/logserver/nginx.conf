# nginx site for the aion2calc log server.
# Install: sudo cp nginx.conf /etc/nginx/sites-available/aion2calc-logs
#          sudo ln -s /etc/nginx/sites-available/aion2calc-logs /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d logs.example.com        # HTTPS (adds the 443 server block)
limit_req_zone $binary_remote_addr zone=a2logs_upload:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name logs.example.com;

    client_max_body_size 26m;           # A2LOGS_MAX_MB + headroom
    gzip on;
    gzip_types application/json text/css text/javascript;

    location = /api/v1/logs {
        limit_req zone=a2logs_upload burst=20 nodelay;
        proxy_pass http://127.0.0.1:8780;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:8780;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
