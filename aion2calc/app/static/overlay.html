<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aion 2 Calc Overlay</title>
<link rel="stylesheet" href="/static/overlay.css">
</head>
<body class="overlay">
<div id="ov"><div class="ovcard pywebview-drag-region" title="Drag the card to move the overlay">
  <div id="ovbg" aria-hidden="true" hidden></div>
  <div class="ovhd"><div class="ovtabs" role="tablist" aria-label="Overlay view">
    <button id="meter-tab" role="tab" data-tab="meter" aria-controls="ovcontent" aria-selected="true" class="on">Meter</button>
    <button id="plan-tab" role="tab" data-tab="plan" aria-controls="ovcontent" aria-selected="false">Plan</button>
  </div><button id="ovlock" title="Freeze the overlay in place for a screenshot">Lock</button><button id="ovsplit" title="Start a new fight — the next combat event begins a fresh encounter (same as Split now in the app)">New</button><button id="ovcopy" title="Copy the current meter as text, to paste in chat or Discord">Copy</button><button id="ovhide" title="Hide overlay">Hide</button><button id="ovcapture" title="Start or stop capturing combat (same as Start/Stop in the app)">Start</button></div>
  <div id="ovmetrics" class="ovtabs ovmetrics" role="group" aria-label="Meter metric">
    <button type="button" data-metric="dps" aria-pressed="true" class="on">DPS</button>
    <button type="button" data-metric="hps" aria-pressed="false">HPS</button>
    <button type="button" data-metric="taken" aria-pressed="false">D.Taken</button>
    <span class="ovsub" id="ovstatus"></span>
  </div>
  <div id="ovconnection" class="ovconnection" role="alert" hidden><span id="ovreason"></span> <button id="ovretry" type="button">Retry</button></div>
  <div class="ovoptions"><label title="Group recorded pet damage and healing into the linked owner"><input id="ovcombine" type="checkbox" checked> Combine pets with owner</label><span id="ovpetstatus" role="status"></span></div>
  <div id="ovping" class="ovping" role="status">Ping: waiting for samples</div>
  <div id="ovfps" class="ovfps" role="status" hidden></div>
  <div id="ovidentity" class="ovidentity" role="status" hidden></div>
  <div id="ovevents" class="ovevents" role="status" hidden></div>
  <div id="ovtarget" class="ovtarget" role="status" hidden></div>
  <div id="ovhpbar" class="ovhpbar" aria-hidden="true" hidden><i></i></div>
  <div id="ovttkbar" class="ovttkbar" aria-hidden="true" hidden><i></i></div>
  <div id="ovgauge" class="ovgauge" aria-hidden="true" hidden><i></i></div>
  <div id="ovdummy" class="ovdummy" role="status" hidden></div>
  <div id="ovcontent" role="tabpanel" aria-labelledby="meter-tab"><div class="muted">Starting…</div></div>
  <div id="ovcontribution" class="ovcontribution" role="status" hidden></div>
  <div id="ovgraph" class="ovgraph" role="img" aria-label="Live DPS graph" hidden></div>
  <div id="ovcooldowns" class="ovcooldowns" role="status" aria-label="Skill cooldowns" hidden></div>
  <div class="ovfoot"><label for="ovop">Opacity</label><input type="range" id="ovop" min="20" max="100" value="72"><span class="ovbrand">Aion 2 Calc</span></div>
</div><div id="ovresize" class="ovgrip" title="Drag to resize the overlay width" aria-hidden="true"></div><div id="ovresize-b" class="ovgrip" title="Drag to resize the overlay height" aria-hidden="true"></div><div id="ovresize-c" class="ovgrip" title="Drag to resize the overlay" aria-hidden="true"></div></div>
<script src="/static/game-assets.js"></script><script src="/static/asset-health.js"></script><script src="/static/npc-portraits.js"></script><script src="/static/event-schedule.js"></script><script src="/static/combat-review.js"></script><script src="/static/overlay.js"></script>
</body>
</html>
