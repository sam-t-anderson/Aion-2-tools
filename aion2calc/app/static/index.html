<body>
<header class="topbar">
  <div class="brand"><img src="/static/logo.png" alt="">Aion 2 Calc <small>AION 2 build planner &amp; combat analyzer</small></div>
  <nav class="nav">
    <a href="#/planner" data-page="planner">Planner</a>
