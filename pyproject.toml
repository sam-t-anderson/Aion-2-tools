[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aion2calc"
# the version is aion2calc.__version__, the one place a release changes it
dynamic = ["version"]
description = "Aion 2 build/rotation simulator and optimizer (global L45 data, KR fallback)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pulp>=2.8,<4", "pillow>=9.1",
                "highspy>=1.7", "lz4>=4.3", "scapy>=2.5", "pystray>=0.19",
                "soundcard>=0.4.6; sys_platform == 'win32'",
                "truststore>=0.10", "certifi>=2024.8.30",
                "winrt-runtime>=3.2.1,<4; sys_platform == 'win32'",
                "winrt-Windows.Foundation>=3.2.1,<4; sys_platform == 'win32'",
                "winrt-Windows.Foundation.Collections>=3.2.1,<4; sys_platform == 'win32'",
                "winrt-Windows.Globalization>=3.2.1,<4; sys_platform == 'win32'",
                "winrt-Windows.Graphics.Imaging>=3.2.1,<4; sys_platform == 'win32'",
                "winrt-Windows.Media.Ocr>=3.2.1,<4; sys_platform == 'win32'",
                "winrt-Windows.Storage.Streams>=3.2.1,<4; sys_platform == 'win32'"]    # in-process MILP solver; avoids CBC's subprocess hang in the packaged app; pystray powers collapse-to-tray; soundcard hears the Hidden Cube radar's jingle (WASAPI loopback); truststore checks HTTPS certificates with the system's verifier, certifi's roots second (aion2calc/tls.py); the winrt modules read the game screen with Windows' own text recognition (aion2calc/screenread)

[project.optional-dependencies]
dev = ["pytest>=7", "coverage>=7.6", "cryptography>=42"]    # cryptography: the test certificates of tests/test_tls.py

[project.scripts]
aion2calc = "aion2calc.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "aion2calc.__version__"}

[tool.setuptools.packages.find]
include = ["aion2calc*"]

[tool.setuptools.package-data]
aion2calc = ["data/**/*.json", "data/seed/*.gz", "app/static/*", "app/static/pages/*", "app/static/i18n/*", "app/static/fonts/*", "app/static/game-assets/*", "meter/*.jsonl", "meter/a2parser/data/**/*.json"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]

[tool.coverage.run]
# every module of the package, so one no test imports counts as uncovered
source = ["aion2calc"]

[tool.coverage.report]
skip_empty = true
