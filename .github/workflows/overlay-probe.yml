# Temporary, removed before merge: runs tools/overlay_window_probe.py on a Windows desktop.
name: Overlay window probe

on:
  push:
    branches: ["claude/sorcerer-l45-build-rotation-qqllwa"]
    paths: [".github/workflows/overlay-probe.yml", "tools/overlay_window_probe.py", "aion2calc/overlay.py"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pywebview pillow websocket-client
      - name: Probe, default browser flags
        run: python tools/overlay_window_probe.py --out probe-out --name default
        timeout-minutes: 4
      - name: Probe, GPU compositing forced on WARP
        if: ${{ !cancelled() }}
        run: python tools/overlay_window_probe.py --out probe-out --name warp --extra-args "--ignore-gpu-blocklist --use-angle=d3d11-warp"
        timeout-minutes: 4
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: overlay-probe
          path: probe-out
