# Tests on every push (any branch) and on pull requests from forks; builds the desktop app on Windows, macOS
# and Linux and checks each build starts (smoke test). A push to main with a new version
# (aion2calc/__init__.py) or a v* tag also publishes a GitHub release with the installer and portable builds.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Tests and lint
    # a pull request from this repository is already tested by its branch's push run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read                 # main's last coverage figures, for the comparison below
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" pyflakes
      - run: python -m pyflakes aion2calc tools tests
      - name: Tests, measuring coverage
        env:
          COVERAGE_CORE: sysmon     # Python 3.12's low-overhead tracer
        run: python -m coverage run -m pytest -q
      - name: Check the frontend scripts parse
        run: for f in aion2calc/app/static/*.js aion2calc/app/static/pages/*.js site/*.js; do node --check "$f"; done
      # ESLint (eslint.config.mjs) and Prettier (.prettierignore names what it formats): the versions
      # package-lock.json names, on the runner's Node.js
      - name: Lint the frontend scripts
        run: node --version && npm ci --no-audit --no-fund && npm run lint && npm run format:check
      # The coverage summary: the total against main's last successful run and the modules whose coverage
      # fell, in the job summary and as a notice with the checks (a warning when it fell). Each run keeps
      # its figures as the coverage-total artifact; main's are what later runs compare with.
      - name: Main's coverage
        if: ${{ !cancelled() && hashFiles('.coverage') != '' && github.ref != 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success \
                --limit 1 --json databaseId --jq '.[0].databaseId') || run=""
          # none yet (or no artifact on it): the summary then shows this run's figures alone
          if [ -n "$run" ]; then gh run download "$run" --repo "$GITHUB_REPOSITORY" --name coverage-total --dir coverage-main || true; fi
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: python tools/coverage_summary.py --baseline coverage-main/coverage-total.json --out coverage-total.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('coverage-total.json') != '' }}
        with:
          name: coverage-total
          path: coverage-total.json
          retention-days: 90
          overwrite: true

  site:
    name: Website
    # Builds the public site the way pages.yml does and opens every page in Chromium, at desktop and
    # phone width, with axe-core: a missing file, a script error, a page that scrolls sideways on a
    # phone or a serious accessibility problem fails the job (tools/site_smoke.py).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install playwright==1.56.0 pyyaml==6.0.2
      # The browser alone: the runner image already has the system libraries Chromium needs (it ships
      # Google Chrome), and --with-deps fetched fonts from Ubuntu's mirror, which stalled for 10 minutes or more.
      - run: python -m playwright install chromium
        timeout-minutes: 10
      - name: axe-core
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/axe" axe-core@4.10.2
      - name: Check every page of the site
        run: python tools/site_smoke.py --axe "$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js"

  browser:
    name: App in a browser
    # The app's own pages in Chromium, served by the real app from a fresh data folder (tests/browser): the
    # navigation, the Live Meter page, and every page opening without an error, under one main heading and
    # with no serious axe-core finding in either theme. The "Tests and lint" job skips these (no browser).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" playwright==1.56.0
      - run: python -m playwright install chromium     # without --with-deps: see the Website job
        timeout-minutes: 10
      - name: axe-core
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/axe" axe-core@4.10.2
      - name: Browser tests
        env:
          AION2CALC_BROWSER_TESTS: "1"
        run: AXE_CORE_JS="$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" python -m pytest -q tests/browser

  build:
    name: Build (${{ matrix.name }})
    needs: [test, browser]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    env:
      # each smoke test below also makes one real request through the app's certificate check
      # (aion2calc/tls.py): the update check's own, so a build that cannot verify GitHub never ships
      AION2CALC_SMOKE_HTTPS: https://api.github.com/repos/sam-t-anderson/Aion-2-tools/releases/latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install . pyinstaller
      - name: Bundle pywebview for the transparent overlay (Windows)
        if: runner.os == 'Windows'
        run: pip install pywebview
      - name: Preset the log server for new users (repository variable A2LOGS_PUBLIC_URL)
        # This is the same deliberately public community-upload key used by Pages.
        # Do not configure an administrative or ownership token here.
        env:
          URL: ${{ vars.A2LOGS_PUBLIC_URL }}
          PUBLIC_COMMUNITY_KEY: ${{ vars.A2LOGS_UPLOAD_KEY }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          default = json.loads(Path('aion2calc/data/global/default_server.json').read_text())
          url = os.environ.get('URL') or default.get('url', '')
          key = os.environ.get('PUBLIC_COMMUNITY_KEY') or ''
          Path('packaging/client.json').write_text(json.dumps({'logserver_url':url, 'visibility':default.get('visibility') or 'public', 'key':key}), encoding='utf-8')
          print('Desktop server configured:', bool(url), 'community upload key configured:', bool(key))
      - run: pyinstaller packaging/aion2calc.spec --noconfirm
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import aion2calc; print(aion2calc.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Verify the HiGHS C++ runtime is bundled (Windows)
        # The CI runner has the Visual C++ redistributable, so the smoke test below loads highs.dll even
        # when its C++ runtime is missing from the bundle -- which then fails on a clean user machine.
        # Gate on the runtime actually being bundled so that regression can never ship silently again.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($dll in @('msvcp140.dll','vcruntime140_1.dll')) {
            if (-not (Get-ChildItem -Recurse -Path dist\aion2calc -Filter $dll -ErrorAction SilentlyContinue)) {
              Write-Error "HiGHS C++ runtime not bundled: $dll missing from dist\aion2calc"
              exit 1
            }
          }
          Write-Host "HiGHS C++ runtime bundled OK"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\aion2calc\aion2calc.exe -ArgumentList '--smoke-test','smoke.txt' -Wait -PassThru -NoNewWindow
          if (Test-Path smoke.txt) { Get-Content smoke.txt }
          exit $p.ExitCode
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          s=0; ./dist/aion2calc.app/Contents/MacOS/aion2calc --smoke-test smoke.txt || s=$?
          cat smoke.txt; exit $s
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          s=0; ./dist/aion2calc/aion2calc --smoke-test smoke.txt || s=$?
          cat smoke.txt; exit $s

      # Code signing (Windows), once an Azure Artifact Signing account is set up (docs/code-signing.md):
      # Smart App Control on Windows 11 blocks a file with no valid signature outright, with no "Run
      # anyway", and SmartScreen warns. Every file of the bundle that runs as code and is not signed
      # already (the app's exe, the Python extension modules) is signed before the installer is built
      # from them; the installer compiler then signs Setup and the uninstaller it writes. Without the
      # repository variable these steps are skipped.
      - name: Sign this build? (Windows)
        # Each file signed takes one of the plan's monthly signatures (about 44 a build), so only a build
        # that publishes a new release is signed, and a manual run (Actions -> CI -> Run workflow) to test
        # the setup. Branch pushes, pull requests and pushes to main that release nothing are not.
        id: sign
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ENDPOINT != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sign=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sign=1; why="a manual run"
          elif [ "$GITHUB_EVENT_NAME" != push ] || { [ "$GITHUB_REF" != refs/heads/main ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; }; then
            why="it publishes no release"
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            why="v$VERSION is released already"
          else
            sign=1; why="it publishes v$VERSION"
          fi
          echo "yes=$sign" >> "$GITHUB_OUTPUT"
          if [ "$sign" = 1 ]; then echo "Signing this build: $why"; else echo "Not signing this build: $why"; fi
      - name: List the files to sign (Windows)
        id: unsigned
        if: steps.sign.outputs.yes == '1'
        shell: pwsh
        run: |
          $root = (Resolve-Path dist).Path
          $files = @(Get-ChildItem -Recurse -File -Path dist\aion2calc -Include *.exe,*.dll,*.pyd |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
          $files | ForEach-Object { $_.FullName.Substring($root.Length + 1) } | Set-Content -Path dist\to-sign.txt -Encoding utf8
          Write-Host "$($files.Count) unsigned files to sign"
          "count=$($files.Count)" >> $env:GITHUB_OUTPUT
      - name: Sign the app's files (Windows)
        if: steps.sign.outputs.yes == '1' && steps.unsigned.outputs.count != '0'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-catalog: dist\to-sign.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign tool for the installer (Windows)
        # Inno Setup signs the uninstaller it writes (unins000.exe) only while it compiles the installer, so
        # the compiler signs Setup and the uninstaller itself: with SignTool from the Windows SDK build tools
        # and Artifact Signing's SignTool plugin (versions pinned), as the account metadata.json names.
        id: signtool
        if: steps.sign.outputs.yes == '1'
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'signtools'
          $nuget = (Get-Command nuget -ErrorAction SilentlyContinue).Source
          if (-not $nuget) {
            $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
            Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nuget
          }
          foreach ($package in @(@('Microsoft.Windows.SDK.BuildTools', '10.0.28000.2705'), @('Microsoft.ArtifactSigning.Client', '1.0.146'))) {
            & $nuget install $package[0] -Version $package[1] -ExcludeVersion -OutputDirectory $tools -NonInteractive
            if ($LASTEXITCODE -ne 0) { Write-Error "nuget could not install $($package[0])"; exit 1 }
          }
          $signtool = Get-ChildItem -Recurse -File -Path (Join-Path $tools 'Microsoft.Windows.SDK.BuildTools') -Filter signtool.exe |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          $dlib = Get-ChildItem -Recurse -File -Path (Join-Path $tools 'Microsoft.ArtifactSigning.Client') -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $signtool -or -not $dlib) { Write-Error 'SignTool or the Artifact Signing plugin is missing from its package'; exit 1 }
          $metadata = Join-Path $tools 'metadata.json'
          # the client secret in the environment (EnvironmentCredential), and no other way to sign in
          [ordered]@{
            Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE
            ExcludeCredentials = @('ManagedIdentityCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential',
              'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzureCliCredential', 'AzurePowerShellCredential',
              'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          # The command the compiler runs for each file it signs: $q stands for a quote, $p for the script's
          # parameters (the file).
          $command = '$q' + $signtool.FullName + '$q sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $q' +
            $dlib.FullName + '$q /dmdf $q' + $metadata + '$q $p'
          "command=$command" >> $env:GITHUB_OUTPUT
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGN_COMMAND: ${{ steps.signtool.outputs.command }}
          # read by SignTool's Artifact Signing plugin while the compiler signs, on a signed build only
          AZURE_TENANT_ID: ${{ steps.sign.outputs.yes == '1' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.sign.outputs.yes == '1' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.sign.outputs.yes == '1' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $sign = @()
          if ($env:SIGN_COMMAND) { $sign = @('/DSign', "/Saion2calcsign=$env:SIGN_COMMAND") }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} @sign packaging\windows\aion2calc.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the signatures (Windows)
        if: steps.sign.outputs.yes == '1'
        shell: pwsh
        run: |
          $bad = @(@(Get-ChildItem dist\aion2calc-setup-*.exe) + @(Get-ChildItem -Recurse -File -Path dist\aion2calc -Include *.exe,*.dll,*.pyd) |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
          if ($bad.Count) { $bad | ForEach-Object { Write-Host "::error::Not signed: $($_.FullName)" }; exit 1 }
          Write-Host "Every file is signed"
      - name: Install, update and a failed update (Windows)
        # An update sets the installed copy aside and puts it back when it does not finish; deleting it
        # first used to leave an app that could not start ("Failed to load Python DLL"). Install the
        # app, update it over itself, then fail an update at its last step (its uninstaller held open,
        # which Setup cancels on in a silent run and rolls back) and check each time that the copy
        # left behind starts, and that the update replaced the old files or put them back whole.
        if: runner.os == 'Windows'
        env:
          SIGNED: ${{ steps.sign.outputs.yes }}
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\aion2calc-setup-*.exe).FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs\aion2calc'
          $logs = Join-Path $env:RUNNER_TEMP 'setup-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          function Install([string]$run) {
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES',
              '/NORESTART', '/NOLAUNCH', '/MERGETASKS=!npcap,!desktopicon', "/LOG=$(Join-Path $logs "$run.log")")
            return $p.ExitCode
          }
          function Expect([string]$run, [bool]$ok, [string]$what) {
            if (-not $ok) {
              Get-ChildItem $logs -Filter *.log | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 80 }
              throw "${run}: $what"
            }
          }
          function Starts([string]$run) {
            $out = Join-Path $env:RUNNER_TEMP "smoke-$run.txt"
            $p = Start-Process -FilePath (Join-Path $app 'aion2calc.exe') -ArgumentList '--smoke-test', $out -Wait -PassThru -NoNewWindow
            if (Test-Path $out) { Get-Content $out }
            Expect $run ($p.ExitCode -eq 0) "the installed app did not start (exit code $($p.ExitCode))"
          }
          $old = Join-Path $app '_internal\left-by-the-copy-before.txt'
          $aside = Join-Path $app '_previous'

          $code = Install 'install'
          Expect 'install' ($code -eq 0) "Setup exited with $code"
          Starts 'install'
          if ($env:SIGNED -eq '1') {
            $uninstaller = Get-AuthenticodeSignature (Join-Path $app 'unins000.exe')
            Expect 'install' ($uninstaller.Status -eq 'Valid') "the uninstaller is not signed ($($uninstaller.Status))"
          }

          Set-Content -Path $old -Value 'old'
          $code = Install 'update'
          Expect 'update' ($code -eq 0) "Setup exited with $code"
          Expect 'update' (-not (Test-Path $old)) 'files of the copy it replaced are still in _internal'
          Expect 'update' (-not (Test-Path $aside)) 'the copy it replaced was not deleted'
          Starts 'update'

          Set-Content -Path $old -Value 'old'
          $held = [IO.File]::Open((Join-Path $app 'unins000.exe'), 'Open', 'Read', 'None')
          try { $code = Install 'failed-update' } finally { $held.Dispose() }
          Expect 'failed update' ($code -eq 5) "Setup exited with $code, not 5 (cancelled and rolled back)"
          Expect 'failed update' (Test-Path $old) 'the copy it was replacing was not put back'
          Expect 'failed update' (-not (Test-Path $aside)) 'the copy it set aside is still in _previous'
          Starts 'failed-update'
          Write-Host 'An install, an update and a failed update each leave an app that starts'
      - name: Rehearse signing the installer (Windows)
        # The signed build's path with a throwaway certificate in place of the signing account, on every
        # build not signed for real: the compiler signs Setup and the uninstaller it writes, and an update
        # installed from that Setup leaves an uninstaller signed by the certificate. Nobody trusts the
        # certificate (the status reads UnknownError); the check is that the signature is there, and whose.
        if: runner.os == 'Windows' && steps.sign.outputs.yes != '1'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=aion2calc signing rehearsal' -CertStoreLocation Cert:\CurrentUser\My
          $pfx = Join-Path $env:RUNNER_TEMP 'rehearsal.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString 'rehearsal' -AsPlainText -Force) | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error 'No SignTool in the Windows SDK on this runner'; exit 1 }
          $command = '$q' + $signtool.FullName + '$q sign /fd SHA256 /f $q' + $pfx + '$q /p rehearsal $p'
          $out = Join-Path $env:RUNNER_TEMP 'rehearsal'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} /DSign "/Saion2calcsign=$command" "/O$out" packaging\windows\aion2calc.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = (Get-ChildItem $out -Filter 'aion2calc-setup-*.exe').FullName
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOLAUNCH', '/MERGETASKS=!npcap,!desktopicon')
          if ($p.ExitCode -ne 0) { Write-Error "The rehearsal's Setup exited with $($p.ExitCode)"; exit 1 }
          foreach ($file in @($setup, (Join-Path $env:LOCALAPPDATA 'Programs\aion2calc\unins000.exe'))) {
            $signer = (Get-AuthenticodeSignature $file).SignerCertificate
            if (-not $signer -or $signer.Thumbprint -ne $cert.Thumbprint) { Write-Error "Not signed by the rehearsal certificate: $file"; exit 1 }
          }
          Write-Host 'The compiler signs Setup and the uninstaller it writes'
      - name: Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\aion2calc -DestinationPath dist\aion2calc-${{ steps.v.outputs.version }}-windows-portable.zip
      - name: macOS zip
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent aion2calc.app aion2calc-${{ steps.v.outputs.version }}-macos.zip
      - name: Linux archive
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/aion2calc-${{ steps.v.outputs.version }}-linux.tar.gz aion2calc
      - uses: actions/upload-artifact@v7
        with:
          name: aion2calc-${{ matrix.name }}
          path: |
            dist/aion2calc-setup-*.exe
            dist/aion2calc-*-windows-portable.zip
            dist/aion2calc-*-macos.zip
            dist/aion2calc-*-linux.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"
          else v=$(python3 -c 'import aion2calc; print(aion2calc.__version__)'); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v8
        if: steps.exists.outputs.yes != '1'
        with:
          path: assets
          pattern: aion2calc-*
          merge-multiple: true
      - name: Release notes for this version
        # packaging/RELEASE_NOTES.md is the full accumulated changelog and grows past
        # GitHub's 125000-char release-body limit; publish only this version's section.
        if: steps.exists.outputs.yes != '1'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          src = pathlib.Path("packaging/RELEASE_NOTES.md").read_text(encoding="utf-8")
          sections = [p for p in re.split(r"(?m)^(?=## )", src) if p.strip()]
          chosen = next(
              (s for s in sections if f"({version})" in s.splitlines()[0]),
              None,
          )
          if chosen is None:
              # Never fall back to an unrelated (older) section — that silently
              # publishes the wrong notes. Use a clear generic body instead and
              # flag the missing changelog entry.
              print(f"::warning::No RELEASE_NOTES.md section for v{version}; using a generic body")
              chosen = (
                  f"## aion2calc {version}\n\n"
                  "See the commit history for the changes in this release.\n"
              )
          if len(chosen) > 125000:  # GitHub release-body hard limit
              chosen = chosen[:124900].rstrip() + "\n\n…\n"
          pathlib.Path("release-notes.md").write_text(chosen, encoding="utf-8")
          print(f"Release notes: {len(chosen)} chars for v{version}")
          PY
      - name: Create the release
        if: steps.exists.outputs.yes != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" assets/* \
            --title "aion2calc ${{ steps.v.outputs.version }}" \
            --notes-file release-notes.md --target "$GITHUB_SHA"
