# Tests on every push (any branch) and on pull requests from forks; builds the desktop app on Windows, macOS
# and Linux and checks each build starts (smoke test). A push to main with a new version
# (aion2calc/__init__.py) or a v* tag also publishes a GitHub release with the installer and portable builds.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Tests and lint
    # a pull request from this repository is already tested by its branch's push run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" pyflakes
      - run: python -m pyflakes aion2calc tests
      - run: python -m pytest -q
      - name: Check the frontend scripts parse
        run: for f in aion2calc/app/static/*.js site/*.js; do node --check "$f"; done

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install . pyinstaller
      - name: Bundle pywebview for the transparent overlay (Windows)
        if: runner.os == 'Windows'
        run: pip install pywebview
      - name: Preset the log server for new users (repository variable A2LOGS_PUBLIC_URL)
        # This is the same deliberately public community-upload key used by Pages.
        # Do not configure an administrative or ownership token here.
        env:
          URL: ${{ vars.A2LOGS_PUBLIC_URL }}
          PUBLIC_COMMUNITY_KEY: ${{ vars.A2LOGS_UPLOAD_KEY }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          default = json.loads(Path('aion2calc/data/global/default_server.json').read_text())
          url = os.environ.get('URL') or default.get('url', '')
          key = os.environ.get('PUBLIC_COMMUNITY_KEY') or ''
          Path('packaging/client.json').write_text(json.dumps({'logserver_url':url, 'visibility':default.get('visibility') or 'public', 'key':key}), encoding='utf-8')
          print('Desktop server configured:', bool(url), 'community upload key configured:', bool(key))
      - run: pyinstaller packaging/aion2calc.spec --noconfirm
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import aion2calc; print(aion2calc.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Verify the HiGHS C++ runtime is bundled (Windows)
        # The CI runner has the Visual C++ redistributable, so the smoke test below loads highs.dll even
        # when its C++ runtime is missing from the bundle -- which then fails on a clean user machine.
        # Gate on the runtime actually being bundled so that regression can never ship silently again.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($dll in @('msvcp140.dll','vcruntime140_1.dll')) {
            if (-not (Get-ChildItem -Recurse -Path dist\aion2calc -Filter $dll -ErrorAction SilentlyContinue)) {
              Write-Error "HiGHS C++ runtime not bundled: $dll missing from dist\aion2calc"
              exit 1
            }
          }
          Write-Host "HiGHS C++ runtime bundled OK"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\aion2calc\aion2calc.exe -ArgumentList '--smoke-test','smoke.txt' -Wait -PassThru -NoNewWindow
          if (Test-Path smoke.txt) { Get-Content smoke.txt }
          exit $p.ExitCode
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          s=0; ./dist/aion2calc.app/Contents/MacOS/aion2calc --smoke-test smoke.txt || s=$?
          cat smoke.txt; exit $s
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          s=0; ./dist/aion2calc/aion2calc --smoke-test smoke.txt || s=$?
          cat smoke.txt; exit $s

      # Code signing (Windows), once an Azure Artifact Signing account is set up (docs/code-signing.md):
      # Smart App Control on Windows 11 blocks a file with no valid signature outright, with no "Run
      # anyway", and SmartScreen warns. Every file of the bundle that runs as code and is not signed
      # already (the app's exe, the Python extension modules) is signed before the installer is built
      # from them, then the installer. Without the repository variable these steps are skipped.
      - name: List the files to sign (Windows)
        id: unsigned
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          $root = (Resolve-Path dist).Path
          $files = @(Get-ChildItem -Recurse -File -Path dist\aion2calc -Include *.exe,*.dll,*.pyd |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
          $files | ForEach-Object { $_.FullName.Substring($root.Length + 1) } | Set-Content -Path dist\to-sign.txt -Encoding utf8
          Write-Host "$($files.Count) unsigned files to sign"
          "count=$($files.Count)" >> $env:GITHUB_OUTPUT
      - name: Sign the app's files (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ENDPOINT != '' && steps.unsigned.outputs.count != '0'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-catalog: dist\to-sign.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} packaging\windows\aion2calc.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign the installer (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: dist
          files-folder-filter: aion2calc-setup-*.exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Check the signatures (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          $bad = @(@(Get-ChildItem dist\aion2calc-setup-*.exe) + @(Get-ChildItem -Recurse -File -Path dist\aion2calc -Include *.exe,*.dll,*.pyd) |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
          if ($bad.Count) { $bad | ForEach-Object { Write-Host "::error::Not signed: $($_.FullName)" }; exit 1 }
          Write-Host "Every file is signed"
      - name: Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\aion2calc -DestinationPath dist\aion2calc-${{ steps.v.outputs.version }}-windows-portable.zip
      - name: macOS zip
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent aion2calc.app aion2calc-${{ steps.v.outputs.version }}-macos.zip
      - name: Linux archive
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/aion2calc-${{ steps.v.outputs.version }}-linux.tar.gz aion2calc
      - uses: actions/upload-artifact@v7
        with:
          name: aion2calc-${{ matrix.name }}
          path: |
            dist/aion2calc-setup-*.exe
            dist/aion2calc-*-windows-portable.zip
            dist/aion2calc-*-macos.zip
            dist/aion2calc-*-linux.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"
          else v=$(python3 -c 'import aion2calc; print(aion2calc.__version__)'); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v8
        if: steps.exists.outputs.yes != '1'
        with:
          path: assets
          pattern: aion2calc-*
          merge-multiple: true
      - name: Release notes for this version
        # packaging/RELEASE_NOTES.md is the full accumulated changelog and grows past
        # GitHub's 125000-char release-body limit; publish only this version's section.
        if: steps.exists.outputs.yes != '1'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          src = pathlib.Path("packaging/RELEASE_NOTES.md").read_text(encoding="utf-8")
          sections = [p for p in re.split(r"(?m)^(?=## )", src) if p.strip()]
          chosen = next(
              (s for s in sections if f"({version})" in s.splitlines()[0]),
              None,
          )
          if chosen is None:
              # Never fall back to an unrelated (older) section — that silently
              # publishes the wrong notes. Use a clear generic body instead and
              # flag the missing changelog entry.
              print(f"::warning::No RELEASE_NOTES.md section for v{version}; using a generic body")
              chosen = (
                  f"## aion2calc {version}\n\n"
                  "See the commit history for the changes in this release.\n"
              )
          if len(chosen) > 125000:  # GitHub release-body hard limit
              chosen = chosen[:124900].rstrip() + "\n\n…\n"
          pathlib.Path("release-notes.md").write_text(chosen, encoding="utf-8")
          print(f"Release notes: {len(chosen)} chars for v{version}")
          PY
      - name: Create the release
        if: steps.exists.outputs.yes != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" assets/* \
            --title "aion2calc ${{ steps.v.outputs.version }}" \
            --notes-file release-notes.md --target "$GITHUB_SHA"
