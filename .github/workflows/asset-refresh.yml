name: Refresh game asset references

on:
  schedule:
    - cron: "23 9 * * *"
  push:
    branches: [main]
    paths:
      - "aion2calc/data/global/classes/*.json"
      - "aion2calc/data/seed/items.json.gz"
      - "aion2calc/data/global/arcana_skill_pools.json"
      - "aion2calc/plan/items.py"
      - "aion2calc/plan/pantheon.py"
      - "tools/export_build_catalog.py"
      - "tools/export_crafting_catalog.py"
      - "tools/export_game_assets.py"
      - "tools/export_npc_portraits.py"
      - "tools/refresh_assets.py"
      - "aion2calc/meter/a2parser/data/i18n/npcs/en.json"
  workflow_dispatch:
    inputs:
      observed_build:
        description: "Optional observed build context (does not verify source applicability)"
        required: false
        type: string
      refresh_existing:
        description: "Fetch existing icon URLs again to detect changed image bytes"
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: game-asset-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OBSERVED_BUILD: ${{ inputs.observed_build || '' }}
      REFRESH_EXISTING: ${{ inputs.refresh_existing || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Reuse the pending collection branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin automation/asset-refresh >/dev/null; then
            git fetch origin automation/asset-refresh
            git checkout -b automation/asset-refresh origin/automation/asset-refresh
            git merge --no-edit origin/main
          else
            git checkout -b automation/asset-refresh
          fi
      - name: Collect published source IDs and assets
        run: |
          extra=()
          if [ "$REFRESH_EXISTING" = true ]; then extra+=(--refresh-existing); fi
          python tools/refresh_assets.py --observed-build "$OBSERVED_BUILD" "${extra[@]}"
      - name: Publish a reviewable snapshot when content changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aion2calc/app/static/build-catalog.json aion2calc/app/static/crafting-catalog.json aion2calc/app/static/game-assets* aion2calc/meter/a2parser/data/i18n/npc-portraits docs/generated/asset-catalog-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh source-ID game assets and catalog audit'
          git push origin automation/asset-refresh
          existing=$(gh pr list --head automation/asset-refresh --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --base main --head automation/asset-refresh --title 'Refresh game assets from published source IDs' --body 'Automated image/reference collection. Review source hashes, unknown IDs, removals and role changes in docs/generated/asset-catalog-audit.json. Gameplay catalogs are staged in that audit and are not promoted automatically. Source collection context is not a verified game-build mapping. Existing CI must pass before merge.'
          fi
          # GITHUB_TOKEN pushes do not trigger CI recursively. Dispatch the
          # existing workflow explicitly so the review has its normal gates.
          gh workflow run ci.yml --ref automation/asset-refresh
