# Publishes the public site (landing, docs and the standalone raid planner) to GitHub Pages.
# The planner shares the app's stylesheet and the raid.js module, so they are copied in at build
# time. Enable once in the repo: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "aion2calc/app/static/app.css"
      - "aion2calc/app/static/raid.js"
      - "aion2calc/app/static/combat-review.*"
      - "aion2calc/app/static/asset-health.js"
      - "aion2calc/app/static/community.js"
      - "aion2calc/app/static/news.js"
      - "aion2calc/app/static/timers.js"
      - "aion2calc/app/static/event-schedules.json"
      - "aion2calc/app/static/archive-upload.js"
      - "aion2calc/app/static/log-ownership.js"
      - "aion2calc/app/static/log-tabs.js"
      - "aion2calc/app/static/logo.png"
      - "aion2calc/data/global/default_server.json"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/static/fonts _site/screenshots
          cp site/*.html _site/
          cp site/*.css site/*.js _site/
          cp aion2calc/app/static/raid.js aion2calc/app/static/asset-health.js aion2calc/app/static/combat-review.js aion2calc/app/static/combat-review.css aion2calc/app/static/community.js aion2calc/app/static/log-ownership.js aion2calc/app/static/archive-upload.js aion2calc/app/static/log-tabs.js aion2calc/app/static/news.js aion2calc/app/static/timers.js aion2calc/app/static/event-schedules.json _site/static/
          cp aion2calc/app/static/logo.png _site/static/ 2>/dev/null || true
          cp aion2calc/app/static/fonts/cinzel-latin.woff2 _site/static/fonts/ 2>/dev/null || true
          # the stylesheet's font URL is absolute (/static/...) for the app; make it relative for the Pages subpath
          sed 's#url("/static/fonts/#url("fonts/#g' aion2calc/app/static/app.css > _site/static/app.css
          cp docs/screenshots/app_dark.png docs/screenshots/app_light.png _site/screenshots/ 2>/dev/null || true
      - name: Default share server (repo variables)
        # The planner defaults Publish/Browse to this server; the visitor can still override it in
        # their browser. The upload key is served in a public file by design (a community upload key),
        # so set A2LOGS_UPLOAD_KEY only if you intend uploads without a visitor-supplied key.
        env:
          SERVER: ${{ vars.A2LOGS_PUBLIC_URL }}
          KEY: ${{ secrets.A2LOGS_UPLOAD_KEY }}
          KEY_VAR: ${{ vars.A2LOGS_UPLOAD_KEY }}
        run: |
          python3 - "$SERVER" "${KEY:-$KEY_VAR}" > _site/config.js <<'PY'
          import json, sys
          print("window.A2CONFIG = %s;" % json.dumps({"server": sys.argv[1], "key": sys.argv[2]}))
          PY
          echo "config.js: $(sed 's/"key": "[^"]*"/"key": "<hidden>"/' _site/config.js)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
