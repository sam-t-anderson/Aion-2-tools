# Deletes a published release and its tag: Actions tab -> "Delete a release" -> Run workflow.
name: Delete a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to delete, for example v0.2.0
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
