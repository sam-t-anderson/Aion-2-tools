name: Bug report
description: Something in the app or website is broken or behaving incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include account passwords, private
        upload credentials, or other secrets. A diagnostic capture is the single
        most useful thing for meter/parsing issues — see the field below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - Desktop app — Live Meter / overlay
        - Desktop app — build optimizer / planner
        - Desktop app — combat review / logs
        - Desktop app — other
        - Website (GitHub Pages)
        - Installer / update / packaging
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: "Shown in the app footer / Settings (e.g. 0.2.144). For the website, note the date."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - N/A (website only)
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Diagnostic capture / log (strongly encouraged for meter & parsing bugs)
      description: >
        For capture, parsing, identity, run-segmentation or boss-classification
        bugs, a diagnostic capture is what lets us reproduce the exact issue.
        Attach it here or say you can provide one privately. Note anything you
        independently know (your character/server, the boss, the outcome) — that
        ground truth is what we use to verify fixes without guessing.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / extra context
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed passwords, private upload credentials and other secrets from everything I attached.
          required: true
